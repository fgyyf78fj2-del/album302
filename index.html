<div class="card">

</div>
<div class="card"><div class="bar"><button id="export">バックアップ保存</button><button id="importBtn">バックアップ復元</button><input type="file" id="importFile" accept=".json,application/json" hidden><button id="copyRank">順位をコピー</button><button id="copyHistory">履歴をコピー</button></div><p class="footnote">比較結果はこのブラウザ内に保存されます。念のため定期的にバックアップしてください。</p></div>

<section class="pane hidden" id="editPane"><p class="muted">作品名は編集可能です。元の番号と順序は維持されます。</p><div class="bar"><button id="saveNames">作品名を保存</button><button id="copyList">リストをコピー</button></div><div class="editlist" id="albumEditor"></div></section>

<p class="footnote">iPhoneではSafariで開き、「共有」→「ホーム画面に追加」でアプリ風に利用できます。HTTPSで公開された環境ではオフライン対応も有効になります。</p>

const STORAGE_KEY="album302_webapp_v3";
let app={albums:originalAlbums.slice(),wins:[],history:[],current:null};
function loadSaved(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const d=JSON.parse(raw);if(d?.albums?.length===302&&Array.isArray(d.wins)&&Array.isArray(d.history))app=d;}}catch(err){}}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({...app,current:null}));}catch(e){status("保存に失敗しました。バックアップを保存してください。");}}
function graph(){let out=Array.from({length:302},()=>[]),incoming=Array.from({length:302},()=>[]);app.wins.forEach(([winner,loser])=>{out[winner].push(loser);incoming[loser].push(winner)});return{out,incoming};}
function reachable(start,adj){let visited=new Set(),stack=[...(adj[start]||[])];while(stack.length){let n=stack.pop();if(n===start||visited.has(n))continue;visited.add(n);stack.push(...adj[n]);}return visited;}
function candidates(){const {out}=graph(),r=Array.from({length:302},(_,i)=>reachable(i,out)),p=[];for(let i=0;i<302;i++)for(let j=i+1;j<302;j++)if(!r[i].has(j)&&!r[j].has(i))p.push([i,j]);return p;}
function score(){let w=Array(302).fill(0),l=Array(302).fill(0);app.wins.forEach(([a,b])=>{w[a]++;l[b]++;});return{w,l};}
function layers(){let {incoming}=graph(),s=score(),remaining=new Set(Array.from({length:302},(_,i)=>i)),groups=[];while(remaining.size){let g=[...remaining].filter(i=>incoming[i].every(p=>!remaining.has(p)));if(!g.length){g=[...remaining].sort((a,b)=>(s.w[a]-s.l[a])-(s.w[b]-s.l[b]));}g.sort((a,b)=>(s.w[b]-s.l[b])-(s.w[a]-s.l[a])||a-b);groups.push(g);g.forEach(i=>remaining.delete(i));}return groups;}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function status(t){document.getElementById("status").textContent=t;}
function render(){document.getElementById("recordCount").textContent=`比較記録 ${app.history.length}件`;document.getElementById("pendingCount").textContent=`未確定 ${candidates().length.toLocaleString()}組`;drawRank();drawHistory();drawStats();drawEditor();}
function drawRank(){let body=document.getElementById("rankRows"),rank=1,s=score(),html="";layers().forEach(g=>g.forEach(i=>html+=`<tr><td>${rank++}</td><td>${esc(app.albums[i])}</td><td>${s.w[i]}</td><td>${s.l[i]}</td></tr>`));body.innerHTML=html;}
function drawHistory(){let el=document.getElementById("historyRows");el.innerHTML="";if(!app.history.length){el.textContent="比較履歴はまだありません。";return;}app.history.slice().reverse().forEach((h,ix)=>{let div=document.createElement("div");div.className="historyitem";div.textContent=`${app.history.length-ix}. ${app.albums[h.w]} ＞ ${app.albums[h.l]}`;el.appendChild(div);});}
function drawStats(){let total=302*301/2,open=candidates().length;document.getElementById("stats").innerHTML=`<p>直接比較: ${app.history.length}</p><p>全ペア: ${total.toLocaleString()}</p><p>未確定ペア: ${open.toLocaleString()}</p><p>推移関係で省略: ${(total-app.history.length-open).toLocaleString()}</p><p>順位グループ数: ${layers().length}</p>`;}
function drawEditor(){let el=document.getElementById("albumEditor");el.innerHTML="";app.albums.forEach((n,i)=>{let div=document.createElement("div");div.className="editrow";div.innerHTML=`<span>${i+1}</span><input data-i="${i}" value="${esc(n)}">`;el.appendChild(div);});}
function next(){let p=candidates();if(!p.length){app.current=null;render();status("比較関係がすべて確定しました。");return;}let pair=p[Math.floor(Math.random()*p.length)];if(Math.random()<.5)pair.reverse();app.current=pair;document.getElementById("choiceA").textContent=app.albums[pair[0]];document.getElementById("choiceB").textContent=app.albums[pair[1]];document.getElementById("choiceA").disabled=false;document.getElementById("choiceB").disabled=false;document.getElementById("pairInfo").textContent=`リスト番号 ${pair[0]+1} vs ${pair[1]+1}`;status("上位に置きたい作品をタップしてください。");persist();}
function selectWinner(w){if(!app.current)return;let [a,b]=app.current,loser=w===a?b:a;app.wins.push([w,loser]);app.history.push({w, l:loser, date:new Date().toISOString()});app.current=null;persist();render();next();}
function undo(){if(!app.history.length){status("取り消す比較はありません。");return;}app.history.pop();app.wins.pop();app.current=null;persist();render();next();}
function clearAll(){if(!confirm("比較記録をすべて消去しますか？（作品名編集は保持します）"))return;app.wins=[];app.history=[];app.current=null;persist();render();next();}
function backup(){let blob=new Blob([JSON.stringify({...app,current:null},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="album302-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function restoreFile(file){let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(d?.albums?.length!==302||!Array.isArray(d.wins)||!Array.isArray(d.history))throw new Error("バックアップ形式が不正です");if(!confirm("現在の比較データをバックアップで置き換えますか？"))return;app={albums:d.albums,wins:d.wins,history:d.history,current:null};persist();render();next();status("復元しました。");}catch(e){alert("復元エラー: "+e.message);}};reader.readAsText(file);}
function copyText(text){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>status("コピーしました。")).catch(()=>status("コピーに失敗しました。"));else status("クリップボード機能に対応していない環境です。");}
document.getElementById("choiceA").onclick=()=>selectWinner(app.current[0]);document.getElementById("choiceB").onclick=()=>selectWinner(app.current[1]);document.getElementById("startNext").onclick=next;document.getElementById("undo").onclick=undo;document.getElementById("clear").onclick=clearAll;document.getElementById("export").onclick=backup;
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();document.getElementById("importFile").onchange=e=>{if(e.target.files[0])restoreFile(e.target.files[0]);e.target.value="";};
document.getElementById("copyRank").onclick=()=>{let n=1,s=score(),a=[];layers().forEach(g=>g.forEach(i=>a.push(`${n++}. ${app.albums[i]} (${s.w[i]}勝 ${s.l[i]}敗)`)));copyText(a.join("\n"));};
document.getElementById("copyHistory").onclick=()=>copyText(app.history.map((h,i)=>`${i+1}. ${app.albums[h.w]} > ${app.albums[h.l]}`).join("\n"));
document.getElementById("saveNames").onclick=()=>{document.querySelectorAll("#albumEditor input").forEach(inp=>app.albums[+inp.dataset.i]=inp.value);persist();render();status("作品名を保存しました。");};
document.getElementById("copyList").onclick=()=>copyText(app.albums.map((x,i)=>`${i+1}. ${x}`).join("\n"));
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".pane").forEach(x=>x.classList.add("hidden"));b.classList.add("active");document.getElementById(b.dataset.pane).classList.remove("hidden");});
loadSaved();render();next();

</script></body></html>
